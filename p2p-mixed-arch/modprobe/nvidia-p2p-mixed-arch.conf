# Layer B (P2P): RTX 5080 (GB203) + Tesla P100 (GP100) on the PATCHED proprietary
# 580.173.02 driver. See P2P_P100_RTX50.md at the top of this repository.
# install-p2p-580.173.02.sh installs this file as
# /etc/modprobe.d/90-nvidia-p2p-mixed-arch.conf.
#
# Use it only together with the patched closed RM, libcuda and uvm_gpu.h. On an
# unpatched or partly patched driver, forced P2P can make peer copies report
# success while the destination memory stays wrong.
#
# Rm4598628 permits GB203 to initialize under the closed R580 RM; the remaining
# values select PCIe BAR1 peer mappings, statically map framebuffer memory,
# permit unprivileged peer mappings, and permit peer reads and writes.
options nvidia NVreg_EnableResizableBar=1 NVreg_RegistryDwords="RMDisableFeatureDisablement=1;EnableResizableBar=1;Rm4598628=0xbf5ae9c6;ForceP2P=0x11;RMForceP2PType=1;RMPcieP2PType=1;PeerMappingOverride=1;RMForceStaticBar1=1"

# Pascal is hardwired to virtual peer-copy addressing in R580 UVM, while
# Blackwell defaults to physical addressing.  A mixed pair must use one mode.
# uvm_enable_debug_procfs=1 only adds UVM debug files under /proc; it was set
# on the test machine and is not needed for P2P.
options nvidia_uvm uvm_peer_copy=virt uvm_enable_debug_procfs=1
