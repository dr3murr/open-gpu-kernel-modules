# Layer A (no P2P): run an RTX 5080 (GB203) and a Tesla P100 (GP100) together on
# the proprietary R580 driver. See P2P_P100_RTX50.md at the top of this repository.
# Install as /etc/modprobe.d/90-nvidia-coexist.conf, then run update-initramfs -u
# and reboot.
#
# Tested with exactly this line on stock 580.196.07 (NVIDIA CUDA repository
# packages). Rm4598628 lets the closed RM initialize GB203: Blackwell normally
# needs the open kernel modules, and those do not support Pascal. Whether
# Rm4598628 alone is enough, without the two resizable-BAR settings and
# RMDisableFeatureDisablement, was not tested.
#
# Do not add the P2P keys (ForceP2P, RMForceP2PType, RMPcieP2PType,
# PeerMappingOverride, RMForceStaticBar1) without the Layer B patches.
options nvidia NVreg_EnableResizableBar=1 NVreg_RegistryDwords="RMDisableFeatureDisablement=1;EnableResizableBar=1;Rm4598628=0xbf5ae9c6"
